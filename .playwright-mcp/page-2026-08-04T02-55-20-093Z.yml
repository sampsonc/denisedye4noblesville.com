  - generic [ref=e52]:
    - heading "My Platform" [level=2] [ref=e53]
    - paragraph [ref=e54]: Three core pillars guiding my campaign for Noblesville Schools
    - generic [ref=e55]:
      - generic [ref=e56]:
        - generic [ref=e57]: 🎓
        - heading "Prioritizing Education" [level=3] [ref=e58]
        - paragraph [ref=e59]: "Every student deserves a strong academic foundation that prepares them for success in college, careers, the trades, military service, and life. Our schools should remain focused on their primary mission: providing a high-quality education that equips students with the knowledge, skills, and character needed to thrive."
        - paragraph [ref=e60]: As a school board member, I will advocate for policies that support academic excellence, empower teachers, and ensure every student has access to meaningful opportunities for achievement.
        - list [ref=e61]:
          - listitem [ref=e62]: → Support a rigorous, knowledge-based, curriculum focused on core academic subjects
          - listitem [ref=e63]: → Promote measureable academic achievement and accountability for student outcomes
          - listitem [ref=e64]: → Support and retain outstanding teachers by providing the resources and respect they deserve
          - listitem [ref=e65]: → Strengthen reading, writing, mathematics, and science education
          - listitem [ref=e66]: → Ensure students graduate prepared for college, careers, military service, or skilled trades
          - listitem [ref=e67]: → Advocate for instructional time that prioritizes academic learning and student achievement
      - generic [ref=e68]:
        - generic [ref=e69]: 🤝
        - heading "Partnering with Parents" [level=3] [ref=e70]
        - paragraph [ref=e71]: Parents are a child’s first and most important teachers. Strong schools are built on strong partnerships between families, teachers, and school leaders. I believe parents deserve a meaningful voice in their children’s education and should be informed, respected, and included in decisions that affect their children.
        - paragraph [ref=e72]: As a school board member, I will advocate for transparency, open communication, and policies that recognize the important role parents play in helping students succeed.
        - list [ref=e73]:
          - listitem [ref=e74]: → Promote open, honest, and timely communication between schools and families.
          - listitem [ref=e75]: → Ensure parents have access to curriculum information, instructional materials, and school policies.
          - listitem [ref=e76]: → Support parental involvement in their children’s education and school activities.
          - listitem [ref=e77]: → Encourage transparency in school board decisions, budgeting, and district initiatives.
          - listitem [ref=e78]: → Protect parents’ rights to be informed about matters affecting their children at school.
          - listitem [ref=e79]: → Foster a culture of collaboration and mutual respect between parents, teachers, administrators, and the school board.
      - generic [ref=e80]:
        - generic [ref=e81]: 💵
        - heading "Promoting Financial Responsibility" [level=3] [ref=e82]
        - paragraph [ref=e83]: Strong schools require responsible leadership. Taxpayer dollars should be managed with the same care and responsibility as families use when managing their household budgets.
        - paragraph [ref=e84]: As as school board member, I will advocate for transparent budgeting, accountable spending, and careful stewardship of taxpayer dollars. Every financial decision should support student success, empower teachers, and ensure our district remains financially strong for years to come.
        - list [ref=e85]:
          - listitem [ref=e86]: → Respecting taxpayers while supporting educational excellence
          - listitem [ref=e87]: → Transparent budgeting and financial accountability
          - listitem [ref=e88]: → Responsible stewardship of taxpayer dollars
          - listitem [ref=e89]: → Reducing waste and improving efficiency
          - listitem [ref=e90]: → Prioritizing classroom and student needs
          - listitem [ref=e91]: → Long-term financial sustainability
