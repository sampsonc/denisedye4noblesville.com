# Cache policy by file type: HTML (and anything else) is never cached;
# static assets get reasonable lifetimes. Evaluated top-down, first match wins.
map $uri $cache_control {
    default                                               "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    "~*\.(?:css|js)$"                                      "public, max-age=3600";
    "~*\.(?:png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$"   "public, max-age=604800";
}

server {
    server_name denisedye4noblesville.com www.denisedye4noblesville.com;

    root /home/chs/denisedye4noblesville.com;
    index index.html index.htm;

    access_log /home/chs/logs/denisedye4noblesville.com.access.log;
    error_log /home/chs/logs/denisedye4noblesville.com.error.log;

    # Security Headers - applied to all responses
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' static.getclicky.com; connect-src 'self' in.getclicky.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # Cache policy (HTML => no-store; assets => reasonable max-age). See map above.
    add_header Cache-Control $cache_control always;

    # Redirect /index.html to / to avoid a duplicate homepage URL.
    # Match $request_uri (the client's original URI) so the index-module
    # internal rewrite of "/" -> "/index.html" does not cause a redirect loop.
    if ($request_uri ~ "^/index\.html(\?|$)") {
        return 301 https://denisedye4noblesville.com/$is_args$args;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Block access to markdown files
    location ~* \.md$ {
        access_log /home/chs/logs/denisedye4noblesville.com.blocked.log;
        return 404;
    }

    # Block access to .bak files
    location ~* \.bak$ {
        access_log /home/chs/logs/denisedye4noblesville.com.blocked.log;
        return 404;
    }

    # Block access to hidden files
    location ~ /\.(?!well-known) {
        access_log /home/chs/logs/denisedye4noblesville.com.blocked.log;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    ### CLICKY ANTI-ADBLOCK PROXY - https://clicky.com/help/proxy
    resolver 1.1.1.1;

    set $cookie "";
    if ($cookie__cky_ignore) {
        set $cookie "_cky_ignore=$cookie__cky_ignore; _cky_osa=$cookie__cky_osa";
    }

    # JAVASCRIPT TRACKING CODE (small server-side cache to spare upstream; browser cache via map)
    location = /1a5ae8c8beb7e24874.js {
        proxy_pass https://static.getclicky.com/js?in=%2Fb31b20043c0afc10d0;
        proxy_connect_timeout 10s;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host static.getclicky.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_cache PROXYCACHE;
        proxy_cache_key "clicky_js_denisedye";
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
    }

    # JAVASCRIPT BEACON (never cached - it's the tracking hit)
    location = /b31b20043c0afc10d0 {
        proxy_pass https://in.getclicky.com/in.php;
        proxy_connect_timeout 10s;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host in.getclicky.com;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $cookie;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
    }
    ### / CLICKY

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/denisedye4noblesville.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/denisedye4noblesville.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = denisedye4noblesville.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name denisedye4noblesville.com www.denisedye4noblesville.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
